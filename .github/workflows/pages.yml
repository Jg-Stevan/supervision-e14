name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Los modelos/OpenCV se materializan en el `prebuild` (preparar); el cache
      # evita bajarlos en cada deploy (clave atada a scripts/assets.lock.json).
      - uses: actions/cache@v4
        with:
          path: |
            public/models/rapidocr/*.onnx
            public/models/tesseract/*.traineddata.gz
            public/vendor/opencv-4.5.5-core.js
          key: assets-${{ runner.os }}-${{ hashFiles('scripts/assets.lock.json') }}
      - run: bunx next typegen
      - run: bun run build
        env:
          NEXT_PUBLIC_BASE_PATH: /supervision-e14
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Cloudflare Pages

# D37 (docs/DECISIONS.md): push a main → build estático (SIN basePath, CF sirve
# en raíz) → wrangler pages deploy. Requiere los secrets CLOUDFLARE_API_TOKEN y
# CLOUDFLARE_ACCOUNT_ID. El out/ incluye public/_headers (COOP/COEP → hilos WASM).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx next typegen
      - run: bunx next build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=supervision-e14 --branch=main

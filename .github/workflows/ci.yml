name: CI

# R1 — puerta de calidad para PRs y push a main:
#   1. bun install --frozen-lockfile (bun.lock es la fuente de verdad)
#   2. bunx tsc --noEmit           (tipado estricto)
#   3. bun run lint                (eslint flat config; reglas relajadas solo
#                                   para src/modules/digitalizador/**)
#   4. bun test                    (bun:test — la suite de datos R3 bloquea)
#
# NO reemplaza el workflow de deploy (cloudflare-pages.yml): este workflow
# solo verifica, no construye ni publica. GitHub Pages quedó retirado.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versiones espejo de package.json:
      #   "packageManager": "bun@1.3.14"  → bun-version: 1.3.14
      #   devDependencies @types/node ^20 → node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Los modelos OCR y OpenCV no se versionan (scripts/preparar-assets.mjs).
      # El cache evita bajar ~40 MB por corrida; la clave cuelga del manifiesto,
      # así que cambiar un hash invalida el cache automáticamente.
      - name: Cache de assets externos
        uses: actions/cache@v4
        with:
          path: |
            public/models/rapidocr/*.onnx
            public/models/tesseract/*.traineddata.gz
            public/vendor/opencv-4.5.5-core.js
          key: assets-${{ runner.os }}-${{ hashFiles('scripts/assets.lock.json') }}

      # Los tests de dict-v5 y de contrato leen los binarios del motor: sin
      # este paso un clon limpio corre la suite contra archivos ausentes.
      - name: Preparar (worker + vendor + assets)
        run: bun run preparar

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint
        # Q-51 (plan 2026-11-12) — cierre del historial ci(r4): el error
        # documentado (react-hooks/set-state-in-effect en panel-perfil.tsx:360)
        # YA NO EXISTE — `bun run lint` está en 0 errores desde la remediación
        # de R4 (la referencia de línea además quedó vencida por los cambios
        # del panel). El lint BLOQUEA el merge, sin excepciones.

      # bun:test — la suite de datos de R3 (src/modules/supervision/data/
      # __tests__: invariantes del catálogo DIVIPOLA, determinismo D21/D43,
      # anclas, golden de KPIs) YA BLOQUEA el merge (R3 — sin
      # continue-on-error).
      - name: Test
        run: bun test

name: CI

# R1 — puerta de calidad para PRs y push a main:
#   1. bun install --frozen-lockfile (bun.lock es la fuente de verdad)
#   2. bunx tsc --noEmit           (tipado estricto)
#   3. bun run lint                (eslint flat config; reglas relajadas solo
#                                   para src/modules/digitalizador/**)
#   4. bun test                    (bun:test — la suite de datos R3 bloquea)
#
# NO reemplaza los workflows de deploy (pages.yml / cloudflare-pages.yml):
# este workflow solo verifica, no construye ni publica.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versiones espejo de package.json:
      #   "packageManager": "bun@1.3.14"  → bun-version: 1.3.14
      #   devDependencies @types/node ^20 → node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint
        # ORQUESTADOR (decisión al mergear r1): 2 errores PRE-EXISTENTES de
        # `react-hooks/set-state-in-effect` en src/modules/** (zona de otros
        # agentes) dejan el lint rojo desde el primer día y enrojecerían el CI
        # de TODOS los PRs futuros, impidiendo distinguir roturas nuevas.
        # TODO(orch): quitar continue-on-error cuando R4 arregle
        # vista-recepcion.tsx:208 y el dueño asigne panel-perfil.tsx:360.
        continue-on-error: true

      # bun:test — la suite de datos de R3 (src/modules/supervision/data/
      # __tests__: invariantes del catálogo DIVIPOLA, determinismo D21/D43,
      # anclas, golden de KPIs) YA BLOQUEA el merge (R3 — sin
      # continue-on-error).
      - name: Test
        run: bun test
